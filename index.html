<div id="gardenPage">

  <video
    class="real-garden"
    autoplay
    muted
    loop
    playsinline
  >
    <source src="jardin.mp4" type="video/mp4">
  </video>

  <div class="garden-light"></div>

  <div class="garden-content">

    <div class="garden-monogram">
      M & M
    </div>

    <div class="garden-names">
      MOUNA & MEHDI
    </div>

    <div class="garden-line"></div>

    <div class="touch">
      Touch to continue
    </div>

    <button
      type="button"
      class="continue-btn"
      id="continueBtn"
    >
      Continuer
    </button>

  </div>

</div>
