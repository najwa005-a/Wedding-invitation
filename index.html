*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#eee8df;
    color:#4c3832;
    font-family:'Cormorant Garamond',serif;
    overflow-x:hidden;
}

/* =========================================================
   INTRO / ENVELOPPE
========================================================= */

.intro{
    position:fixed;
    inset:0;
    z-index:9999;
    background:
        radial-gradient(circle at center,#f9f5ef 0%,#eee7dd 65%,#e4dbce 100%);
    display:flex;
    align-items:center;
    justify-content:center;
    transition:opacity 1.5s ease, visibility 1.5s ease;
}

.intro.hidden{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
}

.intro-content{
    width:min(90vw,460px);
    text-align:center;
    position:relative;
}

.intro-small{
    letter-spacing:4px;
    text-transform:uppercase;
    color:#8c7466;
    font-size:11px;
    margin-bottom:30px;
}

.envelope{
    width:100%;
    height:530px;
    position:relative;
    cursor:pointer;
    perspective:1200px;
    filter:drop-shadow(0 25px 35px rgba(77,51,37,.18));
}

.envelope-body{
    position:absolute;
    inset:0;
    background:
        linear-gradient(145deg,rgba(255,255,255,.7),transparent 40%),
        #eee8de;
    border:1px solid rgba(111,79,58,.18);
    border-radius:4px;
    overflow:hidden;
}

.envelope-body:before{
    content:"";
    position:absolute;
    inset:18px;
    border:1px solid rgba(122,86,63,.18);
    pointer-events:none;
}

.envelope-left,
.envelope-right{
    position:absolute;
    bottom:0;
    width:52%;
    height:70%;
    background:#e9e1d6;
    border:1px solid rgba(117,82,60,.12);
}

.envelope-left{
    left:0;
    clip-path:polygon(0 0,100% 100%,0 100%);
}

.envelope-right{
    right:0;
    clip-path:polygon(100% 0,100% 100%,0 100%);
}

.flap{
    position:absolute;
    left:0;
    top:0;
    width:100%;
    height:58%;
    background:
        linear-gradient(145deg,#f7f2eb,#e7ded3);
    clip-path:polygon(0 0,100% 0,50% 100%);
    transform-origin:top center;
    transition:transform 1.5s cubic-bezier(.2,.7,.2,1);
    z-index:5;
    border-top:1px solid rgba(100,70,50,.1);
}

.envelope.open .flap{
    transform:rotateX(180deg);
}

.wax{
    position:absolute;
    width:112px;
    height:112px;
    left:50%;
    top:52%;
    transform:translate(-50%,-50%);
    z-index:10;
    border-radius:50%;
    background:
        radial-gradient(circle at 35% 25%,#a34d4c,#701d2c 45%,#4a0f1b 100%);
    box-shadow:
        0 7px 12px rgba(52,12,18,.35),
        inset 0 3px 5px rgba(255,255,255,.2),
        inset 0 -7px 12px rgba(20,0,5,.35);
    transition:transform 1s ease,opacity .8s ease;
}

.wax:before{
    content:"";
    position:absolute;
    inset:9px;
    border:1px solid rgba(255,215,175,.4);
    border-radius:50%;
}

.wax span{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#f3d9bf;
    font-family:'Italianno',cursive;
    font-size:42px;
    text-shadow:0 1px 2px rgba(0,0,0,.4);
}

.envelope.open .wax{
    transform:translate(-50%,-50%) scale(.75);
    opacity:0;
}

.open-text{
    margin-top:30px;
    font-family:'Cormorant Garamond',serif;
    letter-spacing:3px;
    text-transform:uppercase;
    color:#674b3d;
    font-size:13px;
    animation:pulse 2.2s infinite;
}

.open-arrow{
    margin-top:13px;
    font-size:20px;
    color:#7a2330;
}

@keyframes pulse{
    0%,100%{opacity:.45}
    50%{opacity:1}
}
